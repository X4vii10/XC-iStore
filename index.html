<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XC iStore</title>
<meta name="theme-color" content="#0A0C13">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap">
<style>
/* Concepto: panel de bolsillo oscuro, tarjetas planas, azul neón para dinero que entra y morado para ganancia. Gris con tinte azul para todo lo demás. */
:root{
  --bg:#0A0C13; --surface:#11141E; --surface2:#181C29; --line:#252A3A;
  --fg:#E9ECF6; --muted:#8B93AA;
  --blue:#2FB4FF; --blue-ink:#04121F; --purple:#A07BFF;
  --good:#34D399; --warn:#FBBF24; --bad:#FF6B86;
  --glow:rgba(47,180,255,.16);
  --f-display:'Sora',system-ui,sans-serif; --f-body:'IBM Plex Sans',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F3F5FA; --surface:#FFFFFF; --surface2:#EBEEF6; --line:#D9DEEA;
    --fg:#10131C; --muted:#5C6479;
    --blue:#0A74E6; --blue-ink:#FFFFFF; --purple:#6B3FE0;
    --good:#0F8A5F; --warn:#9A6700; --bad:#C62A47;
    --glow:rgba(10,116,230,.10);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F3F5FA; --surface:#FFFFFF; --surface2:#EBEEF6; --line:#D9DEEA;
  --fg:#10131C; --muted:#5C6479;
  --blue:#0A74E6; --blue-ink:#FFFFFF; --purple:#6B3FE0;
  --good:#0F8A5F; --warn:#9A6700; --bad:#C62A47;
  --glow:rgba(10,116,230,.10);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:560px;margin-inline:auto}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.cap{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;border-radius:11px;display:block;background:#000;flex:none}
.brand b{font-family:var(--f-display);font-size:18px;font-weight:600;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.top-r{display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px}
.icon-btn.on{border-color:var(--blue);color:var(--blue)}

h2{font-family:var(--f-display);font-size:20px;font-weight:600;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-size:15px;font-weight:600;margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.row.sb{justify-content:space-between}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.hello{display:flex;gap:14px;align-items:center;padding-block:6px 2px}
.hello .logo{width:56px;height:56px;border-radius:15px}
.hello .big{font-family:var(--f-display);font-size:22px;font-weight:600;text-wrap:balance;display:block;line-height:1.2}
.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;min-width:0}
.rate .v{font-size:16px;font-weight:500;display:block;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.pill.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.pill.blue{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 45%,var(--line))}

.btn{border:1px solid var(--line);background:var(--surface2);border-radius:11px;padding:11px 16px;font-weight:600;min-height:44px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink);box-shadow:0 0 0 4px var(--glow)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,var(--line));background:transparent}
.btn.small{min-height:36px;padding:7px 12px;font-size:13px}
.btn.block{width:100%}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:500}
.chip.on{background:var(--surface2);color:var(--fg);border-color:var(--blue)}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.kpi .v{font-size:26px;font-weight:600;display:block;margin-top:4px;line-height:1.1;overflow-wrap:anywhere}
.kpi.blue .v{color:var(--blue)}
.kpi.purple .v{color:var(--purple)}
.foot{font-size:12px;color:var(--muted)}
.big-n{font-size:22px;font-weight:600;display:block;line-height:1.15;overflow-wrap:anywhere}

.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:112px;margin-top:12px}
.bcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
.bpair{display:flex;align-items:flex-end;gap:3px;height:92px;width:100%;justify-content:center}
.bar{width:38%;max-width:14px;border-radius:4px 4px 0 0;min-height:2px}
.bar.rev{background:var(--blue)}
.bar.pro{background:var(--purple)}
.bcol span{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.chart{width:100%;height:auto;display:block;margin-top:10px}
.chart text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.scroll-x{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:500;color:var(--muted);text-align:right;padding:6px 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
td{padding:8px;text-align:right;border-top:1px solid var(--line);font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left;font-family:var(--f-body)}

.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);width:100%;background:none;border-inline:0;border-bottom:0;text-align:left}
.item:first-child{border-top:0}
.item .r{text-align:right;flex:none}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.dayh{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 0 4px;font-weight:500}
.pic{width:76px;height:76px;border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none;border:1px solid var(--line)}
.pic img{width:100%;height:100%;object-fit:contain;display:block}
.pic span{font-family:var(--f-display);font-weight:600;color:#6B7280;font-size:22px}
.pic.sm{width:52px;height:52px;border-radius:10px}
.meter{height:7px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--purple);border-radius:99px}
.meter i.over{background:var(--bad)}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.monthnav b{font-family:var(--f-display);text-transform:capitalize}

.empty{padding:22px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);margin-bottom:4px}

label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
.field{display:flex;flex-direction:column}
input[type=text],input[type=password],input[type=date],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:44px}
textarea{min-height:92px;font-family:var(--f-mono);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:9px 6px;font-size:13px;font-weight:600;color:var(--muted);min-height:38px}
.seg button.on{background:var(--bg);color:var(--fg);box-shadow:inset 0 0 0 1px var(--blue)}
.prev{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.prev .l{display:flex;justify-content:space-between;gap:10px}
.err{color:var(--bad);font-size:13px;min-height:18px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11px;font-weight:500;border-radius:10px;min-height:48px}
.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--blue)}

.scrim{position:fixed;inset:0;z-index:40;background:rgba(3,5,10,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;max-width:90vw}
@media (max-width:380px){.rates{grid-template-columns:1fr 1fr}.kpi .v{font-size:22px}.three{grid-template-columns:1fr 1fr}}
.calc{position:fixed;inset:0;z-index:36;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.cv-top{display:flex;align-items:center;gap:12px;padding:12px 0}.cv-top h2{flex:1;margin:0}
.cv-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px;min-height:0}
.cv-sec{position:relative;display:flex;flex-direction:column;gap:6px}
.cvchip{align-self:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 16px;font-weight:600;font-size:15px}
.cvlist{position:absolute;top:46px;left:0;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:column;min-width:230px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.cvlist button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;font-size:15px}
.cvlist button.on{background:var(--surface2);color:var(--blue)}
.cv-amt{font-family:var(--f-display);font-weight:700;line-height:1.15;word-break:break-all;min-height:56px}
.cv-mid{display:flex;align-items:center;gap:14px}.cv-mid i{flex:1;height:1px;background:var(--line)}
.cv-swap{width:52px;height:52px;border-radius:50%;border:0;background:var(--blue);color:var(--blue-ink);display:grid;place-items:center}.cv-swap svg{width:24px;height:24px}
.icon-btn.sm{width:36px;height:36px}.icon-btn.sm svg{width:18px;height:18px}
.cv-info{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;margin-top:6px}.cv-info span{color:var(--muted);font-size:12px}
.cv-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.ck{min-height:56px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font:600 22px var(--f-display);color:var(--fg)}
.ck.op{background:var(--surface2);color:var(--muted)}.ck.clr{color:var(--warn)}.ck.eq{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.ck:active{filter:brightness(1.25)}
@media (max-height:700px){.ck{min-height:46px}}
.stackbar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface2)}
.stackbar i{display:block;height:100%}
.sug{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.sug:first-child{border-top:0}
.sug .d{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px}
.sug .st{font-weight:600;font-size:14px;line-height:1.3}
.sug .ss{color:var(--muted);font-size:13px;line-height:1.35}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.tab{transition:background .15s,border-color .15s,color .15s}}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
input[type=password]{letter-spacing:.3em}
.lockscr{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;padding:24px}
.lock-in{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:300px;text-align:center}
.lock-in .logo{width:72px;height:72px;border-radius:20px}
.dots{display:flex;gap:14px;margin-block:4px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);display:block}
.dots i.on{background:var(--blue);border-color:var(--blue)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.pad button{height:62px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-family:var(--f-display);font-size:22px;font-weight:600}
.pad .gh{visibility:hidden}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <img class="logo" id="logo" alt="Logo XC iStore" width="40" height="40">
      <div><b>XC iStore</b><small>Panel privado</small></div>
    </div>
    <div class="top-r">
      <span id="persist"></span>
      <button class="icon-btn" data-act="conv" aria-label="Calculadora de conversión"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8.5 7.5h7M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"/></svg></button>
      <button class="icon-btn" id="ratesbtn" data-act="tab" data-v="rates" aria-label="Tasas y respaldo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg></button>
      <button class="icon-btn" data-act="theme" aria-label="Cambiar entre tema oscuro y claro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17" /><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
    </div>
  </header>
  <main id="view" class="stack"></main>
</div>

<nav class="tabs" aria-label="Secciones">
  <div class="tabs-in">
    <button class="tab" data-act="tab" data-v="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
    <button class="tab" data-act="tab" data-v="sales"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Ventas</button>
    <button class="tab" data-act="tab" data-v="stock"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>Stock</button>
    <button class="tab" data-act="tab" data-v="personal"><svg viewBox="0 0 24 24"><path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7l12-3v3M17 14h2"/></svg>Personal</button>
    <button class="tab" data-act="tab" data-v="reports"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M2 20h20"/></svg>Reportes</button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-h"><h2 id="sheet-title"></h2><button class="icon-btn" data-act="close" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="sheet-body"></div>
  </div>
</div>
<div class="lockscr" id="lockscr" hidden>
  <div class="lock-in">
    <img class="logo" id="lock-logo" alt="Logo XC iStore" width="72" height="72">
    <h2>XC iStore</h2>
    <p class="muted" id="lock-msg" style="margin:0">Ingresa tu PIN</p>
    <div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="pad">
      <button data-act="pinkey" data-v="1">1</button><button data-act="pinkey" data-v="2">2</button><button data-act="pinkey" data-v="3">3</button>
      <button data-act="pinkey" data-v="4">4</button><button data-act="pinkey" data-v="5">5</button><button data-act="pinkey" data-v="6">6</button>
      <button data-act="pinkey" data-v="7">7</button><button data-act="pinkey" data-v="8">8</button><button data-act="pinkey" data-v="9">9</button>
      <button class="gh" tabindex="-1" aria-hidden="true">0</button><button data-act="pinkey" data-v="0">0</button><button data-act="pinkey" data-v="del" aria-label="Borrar">&#9003;</button>
    </div>
    <p class="muted" style="margin:6px 0 0;font-size:12px">¿Olvidaste el PIN? Borra los datos del sitio en Chrome y restaura tu respaldo.</p>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>

/* ---------- utilidades ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var pad=function(n){return String(n).padStart(2,'0')};
var ds=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var today=function(){return ds(new Date())};
var num=function(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0};
var fmt=function(n,d){d=d==null?2:d;return Number(n||0).toLocaleString('es-VE',{minimumFractionDigits:d,maximumFractionDigits:d})};
var usd=function(n){return (n<0?'-':'')+'$'+fmt(Math.abs(n))};
var pct=function(n){return fmt(n*100,0)+'%'};
var inp=function(n){return String(Math.round(n*100)/100).replace('.',',')};
var sum=function(a,k){return a.reduce(function(t,x){return t+(x[k]||0)},0)};
function dayDiff(d){var a=new Date(d+'T00:00:00'),b=new Date(today()+'T00:00:00');return Math.round((b-a)/864e5)}
function inPeriod(d,p){p=p||UI.period;if(p==='all')return true;if(p==='today')return d===today();if(p==='week'){var x=dayDiff(d);return x>=0&&x<=6}if(p==='month')return d.slice(0,7)===today().slice(0,7);return true}
function fdate(d){var s=d.split('-');return s[2]+'/'+s[1]}
function dayLabel(d){var x=dayDiff(d);if(x===0)return 'Hoy';if(x===1)return 'Ayer';var s=d.split('-');return s[2]+'/'+s[1]+'/'+s[0]}
function monthLabel(m){var s=m.split('-');return new Date(+s[0],+s[1]-1,1).toLocaleDateString('es-VE',{month:'long',year:'numeric'})}
function shiftMonth(m,d){var s=m.split('-'),dt=new Date(+s[0],+s[1]-1+d,1);return dt.getFullYear()+'-'+pad(dt.getMonth()+1)}
function nice(v){if(v<=0)return 10;var p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}

/* ---------- estado y almacenamiento (IndexedDB, solo en este navegador) ---------- */
var STORES=['products','purchases','sales','rates','income','budget','expenses','bizexp'];
var S={products:[],purchases:[],sales:[],rates:[],income:[],budget:[],expenses:[],bizexp:[],settings:normSettings()};
var UI={tab:'home',period:'week',q:'',persist:true,pm:null,rep:'week',sc:'all',sugAll:false,plm:null,h:{type:'all',range:'30',q:''}};
var db=null;

function openDB(){return new Promise(function(res,rej){
  try{var r=indexedDB.open('xcstore',3);
    r.onupgradeneeded=function(){var d=r.result;STORES.forEach(function(n){if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'key'})};
    r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};
  }catch(e){rej(e)}})}
function getAll(n){return new Promise(function(res,rej){var r=db.transaction(n).objectStore(n).getAll();r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function getKey(n,k){return new Promise(function(res,rej){var r=db.transaction(n).objectStore(n).get(k);r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function dbPut(n,o){if(!db)return;try{db.transaction(n,'readwrite').objectStore(n).put(o)}catch(e){UI.persist=false}}
function dbDel(n,id){if(!db)return;try{db.transaction(n,'readwrite').objectStore(n).delete(id)}catch(e){UI.persist=false}}
function dbClear(){if(!db)return;STORES.forEach(function(n){try{db.transaction(n,'readwrite').objectStore(n).clear()}catch(e){}})}
function put(n,o){var a=S[n],i=a.findIndex(function(x){return x.id===o.id});if(i>=0)a[i]=o;else a.push(o);dbPut(n,o)}
function del(n,id){S[n]=S[n].filter(function(x){return x.id!==id});dbDel(n,id)}
function saveSettings(){dbPut('meta',{key:'settings',value:S.settings})}

/* ---------- tasas y cálculo ---------- */
function curRates(){return S.rates.slice().sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)})[0]||{bcv:0,euro:0,usdt:0,date:today()}}
function realRate(r){return r.usdt||r.bcv||1}
/* Dólar real = bolívares / tasa USDT de Binance. Costos a tasa euro o BCV y precios a tasa BCV se convierten a ese dólar. */
function toReal(nom,basis,r){if(basis==='usd')return nom;var rate=basis==='euro'?r.euro:r.bcv;return nom*(rate||0)/realRate(r)}
function toRealCur(a,cur,r){return cur==='bs'?a/realRate(r):a}
function isInitial(x){return x.initial||x.note==='Inventario inicial (estimado)'}
function pstats(p){
  var pu=S.purchases.filter(function(x){return x.productId===p.id}),sa=S.sales.filter(function(x){return x.productId===p.id});
  var qin=sum(pu,'qty'),qout=sum(sa,'qty'),cost=sum(pu,'totalReal'),avg=qin?cost/qin:0;
  return {stock:qin-qout,avg:avg,value:(qin-qout)*avg,sold:qout,profit:sum(sa,'profitReal')};
}
function prod(id){return S.products.find(function(p){return p.id===id})}
function imgKey(name){var n=String(name).toLowerCase();if(/airpods/.test(n))return 'airpods';if(/battery/.test(n))return 'battery';if(/cargador/.test(n))return 'cargador';if(/usb-c a usb-c/.test(n))return 'cableC';if(/lightning/.test(n))return 'cableL';if(/forro|silicon/.test(n))return 'forro';return ''}
function imgFor(p){return p.img||IMGS[imgKey(p.name)]||''}
function pic(p,sm){var im=imgFor(p);return '<div class="pic'+(sm?' sm':'')+'">'+(im?'<img src="'+im+'" alt="'+esc(p.name)+'" loading="lazy">':'<span>'+esc((p.name||'?').charAt(0).toUpperCase())+'</span>')+'</div>'}

/* ---------- finanzas personales ---------- */
function curMonth(){return UI.pm||today().slice(0,7)}
function planReal(it){return toRealCur(it.amount,it.currency,curRates())}
function health(m){
  var inc=S.income.filter(function(x){return x.date.slice(0,7)===m}),exp=S.expenses.filter(function(x){return x.date.slice(0,7)===m});
  var A=sum(inc,'real'),B=sum(exp,'real'),C=0,sav=0,savDone=0;
  S.budget.forEach(function(it){var pr=planReal(it);C+=pr;if(it.kind==='ahorro'){sav+=pr;savDone+=sum(exp.filter(function(e){return e.itemId===it.id}),'real')}});
  var pend=Math.max(0,sav-savDone),free=A-B-pend;
  var sm=S.sales.filter(function(s){return s.date.slice(0,7)===m}),gain=sum(sm,'profitReal')-sum(S.bizexp.filter(function(x){return x.date.slice(0,7)===m}),'real');
  var draws=sum(inc.filter(function(x){return x.source==='Retiro del negocio'}),'real'),gfree=Math.max(0,gain-draws);
  var stockVal=0;S.products.forEach(function(p){stockVal+=pstats(p).value});
  var T=S.settings.capitalTarget||0,falta=Math.max(0,T-stockVal),reinv=Math.min(gfree,falta),retirable=Math.max(0,gfree-reinv);
  var st,msg;
  if(!S.budget.length&&!inc.length&&!exp.length){st='none';msg='Registra tus ingresos y crea tu presupuesto para ver tu salud financiera.'}
  else if(C>0&&B>C){st='bad';msg='Ya gastaste más de lo presupuestado este mes.'}
  else if(A<=0){st='warn';msg='Aún no registras ingresos este mes.'}
  else if(free<0){st='bad';msg='Tus gastos y el ahorro pendiente superan tus ingresos del mes.'}
  else if(A<C){st='warn';msg='Tus ingresos del mes aún no cubren el presupuesto.'}
  else if(falta>0){st='warn';msg='Tu capital de trabajo está por debajo del objetivo.'}
  else{st='good';msg='Vas bien: puedes gastar dentro del presupuesto sin tocar tu capital.'}
  return {A:A,B:B,C:C,pend:pend,free:free,gain:gain,draws:draws,gfree:gfree,stockVal:stockVal,T:T,falta:falta,reinv:reinv,retirable:retirable,st:st,msg:msg};
}

function buckets(mode){
  var arr=[],now=new Date();now.setHours(0,0,0,0);var k,s,e;
  if(mode==='week'){var mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));
    for(k=7;k>=0;k--){s=new Date(mon);s.setDate(mon.getDate()-7*k);e=new Date(s);e.setDate(s.getDate()+6);arr.push({s:ds(s),e:ds(e),l:pad(s.getDate())+'/'+pad(s.getMonth()+1)})}}
  else{for(k=5;k>=0;k--){s=new Date(now.getFullYear(),now.getMonth()-k,1);e=new Date(now.getFullYear(),now.getMonth()-k+1,0);arr.push({s:ds(s),e:ds(e),l:s.toLocaleDateString('es-VE',{month:'short'}).replace('.','')})}}
  arr.forEach(function(b){
    var sa=S.sales.filter(function(x){return x.date>=b.s&&x.date<=b.e}),pu=S.purchases.filter(function(x){return !isInitial(x)&&!x.adjust&&x.date>=b.s&&x.date<=b.e});
    b.v=sum(sa,'revenueReal');b.i=sum(pu,'totalReal');b.g=sum(sa,'profitReal')-sum(S.bizexp.filter(function(x){return x.date>=b.s&&x.date<=b.e}),'real')});
  return arr;
}
function chartSVG(b){
  var W=360,H=190,pl=40,pr=6,pt=10,pb=24,iw=W-pl-pr,ih=H-pt-pb,mx=nice(Math.max.apply(null,b.map(function(x){return Math.max(x.v,x.i,x.g,0)}))),gw=iw/b.length,bw=Math.min(14,gw*.24),svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ventas, inversión y ganancia por período">';
  [0,.5,1].forEach(function(f){var y=pt+ih-f*ih;svg+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/><text x="'+(pl-6)+'" y="'+(y+3)+'" text-anchor="end">$'+fmt(mx*f,0)+'</text>'});
  b.forEach(function(x,i){var cx=pl+gw*i+gw/2;
    [[x.v,'var(--blue)',-1],[x.i,'var(--muted)',0],[Math.max(x.g,0),'var(--purple)',1]].forEach(function(s){var h=mx?s[0]/mx*ih:0,xx=cx+s[2]*(bw+2)-bw/2;svg+='<rect x="'+xx+'" y="'+(pt+ih-h)+'" width="'+bw+'" height="'+Math.max(h,s[0]>0?1.5:0)+'" rx="2" style="fill:'+s[1]+'"/>'});
    svg+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+esc(x.l)+'</text>'});
  return svg+'</svg>';
}

function ctx(){
  var r=curRates(),mon=today().slice(0,7),T={r:r,age:dayDiff(r.date)};
  var s30=S.sales.filter(function(s){return dayDiff(s.date)<=29});
  T.rows=S.products.map(function(p){var st=pstats(p),ps=s30.filter(function(s){return s.productId===p.id}),sold=sum(ps,'qty'),v=sold/30,pr=toReal(p.priceBcv,'bcv',r);
    return {p:p,st:st,sold:sold,rev:sum(ps,'revenueReal'),v:v,cover:v>0?st.stock/v:null,mg:pr?(pr-st.avg)/pr:0,min:p.minStock||0}});
  T.s30=s30;T.rev30=sum(s30,'revenueReal');
  var sm=S.sales.filter(function(s){return s.date.slice(0,7)===mon});
  T.rev=sum(sm,'revenueReal');T.pro=sum(sm,'profitReal');T.bx=sum(S.bizexp.filter(function(x){return x.date.slice(0,7)===mon}),'real');T.neta=T.pro-T.bx;T.n=sm.length;T.ext=sum(sm,'extraReal');
  T.stockVal=T.rows.reduce(function(t,x){return t+x.st.value},0);
  return T;
}
function restockPlan(T,money){
  var budget=money*.9,left=budget,out=[];
  T.rows.map(function(x){var cost=x.st.avg||toReal(x.p.priceBcv,'bcv',T.r)*.5,target=Math.max(x.min+2,Math.ceil(x.v*21));
    return {x:x,cost:cost,need:target-x.st.stock,hot:x.st.stock<=x.min||(x.cover!=null&&x.cover<21),score:(x.st.stock<=0?1e3:0)+(x.cover!=null&&x.cover<14?500:0)+x.v*Math.max(x.mg,.05)*100}})
  .filter(function(k){return k.hot&&k.need>0&&k.cost>0}).sort(function(a,b){return b.score-a.score})
  .forEach(function(k){var q=Math.min(k.need,Math.floor(left/k.cost));if(q>0){out.push({p:k.x.p,q:q,cost:q*k.cost});left-=q*k.cost}});
  return {items:out,left:money-(budget-left)};
}

function cvNum(t){var p=t.split(','),ip=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');return ip+(p.length>1?','+p[1]:'')}

function cvEval(e){
  var tk=e.replace(/,/g,'.').split(/([+\-*\/])/).filter(function(x){return x!==''});
  while(tk.length&&/[+\-*\/]/.test(tk[tk.length-1]))tk.pop();
  if(!tk.length)return 0;
  var out=[+tk[0]||0],i,op,v;
  for(i=1;i<tk.length;i+=2){op=tk[i];v=+tk[i+1]||0;
    if(op==='*')out[out.length-1]*=v;else if(op==='/')out[out.length-1]=v?out[out.length-1]/v:0;else out.push(op==='-'?-v:v)}
  return out.reduce(function(a,b){return a+b},0);
}

function cvKey(k){
  var e=C.expr,last=e.slice(-1),isOp=function(c){return /[+\-*\/]/.test(c)},opmap={add:'+',sub:'-',mul:'*',div:'/'};
  if(k==='C')e='';

  else if(k==='eq'){var v=cvEval(e);e=v?String(Math.round(v*100)/100).replace('.',','):''}
  else if(opmap[k]){if(e==='')return;if(isOp(last))e=e.slice(0,-1);e+=opmap[k]}
  else{var cur=e.split(/[+\-*\/]/).pop();
    if(k===','){if(cur.indexOf(',')>=0)return;e+=cur===''?'0,':','}
    else if(cur.indexOf(',')>=0&&cur.split(',')[1].length>=(k==='00'?1:2))return;
    else if(k==='00'){if(cur===''||cur==='0')return;e+='00'}
    else{if(cur==='0')e=e.slice(0,-1);e+=k}}
  if(e.length>24)return;C.expr=e;updateConv();
}

function skipped(){var skip='';try{skip=localStorage.getItem('xc-rate-skip')||''}catch(e){skip=UI.skip||''}return skip===today()}

  openSheet('Tasas de hoy','<div class="stack"><p class="muted" style="margin:0;font-size:14px">'+esc(note)+(S.rates.length?' Tus últimas tasas guardadas son de '+dayLabel(r.date).toLowerCase()+'.':'')+(wk?' Hoy es fin de semana: el BCV suele mantener la tasa del viernes.':'')+'</p>'
    +'<div class="three"><div class="field"><label for="rr-bcv">Dólar BCV</label><input type="text" id="rr-bcv" inputmode="decimal" value="'+(pre.bcv||r.bcv?inp(pre.bcv||r.bcv):'')+'"></div><div class="field"><label for="rr-eur">Euro BCV</label><input type="text" id="rr-eur" inputmode="decimal" value="'+(pre.euro||r.euro?inp(pre.euro||r.euro):'')+'"></div><div class="field"><label for="rr-usdt">USDT</label><input type="text" id="rr-usdt" inputmode="decimal" value="'+(pre.usdt||r.usdt?inp(pre.usdt||r.usdt):'')+'"></div></div>'
    +'<div class="err" id="rr-err"></div><button class="btn primary block" data-act="saverates2">Guardar tasas de hoy</button>'+(S.rates.length?'<button class="btn ghost block" data-act="keeprates">Mantener las de '+dayLabel(r.date).toLowerCase()+' por hoy</button>':'')+'</div>');
}

/* tasas automáticas: se consultan al abrir la app el primer día. Si falla, se piden a mano. */
async function getJson(url){
  var c=new AbortController(),t=setTimeout(function(){c.abort()},9000);
  try{var r=await fetch(url,{signal:c.signal,cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}
}
function near(a,b){return !b||(a>b*.65&&a<b*1.35)}
async function fetchRates(){
  var out={},log=[];
  async function dolarapi(url,map){
    try{var d=await getJson(url);(Array.isArray(d)?d:[d]).forEach(function(x){if(!x)return;
      var f=String(x.fuente||x.nombre||x.source||'').toLowerCase(),v=num(x.promedio!=null?x.promedio:(x.venta!=null?x.venta:x.price));
      if(v>0&&map[f]&&!out[map[f]])out[map[f]]=v});log.push('Consultada '+url)}
    catch(e){log.push('Falló '+url+' ('+(e&&e.message||e)+')')}
  }
  async function pydolar(url,key){
    try{var d=await getJson(url),m=d&&d.monitors;
      if(m){Object.keys(m).forEach(function(k){var x=m[k],n=String(x&&(x.title||x.name||k)).toLowerCase();if(x&&num(x.price)>0&&/bcv|oficial|usd|dolar|euro|eur/.test(n)&&!out[key])out[key]=num(x.price)})}
      log.push('Consultada '+url)}
    catch(e){log.push('Falló '+url+' ('+(e&&e.message||e)+')')}
  }
  await dolarapi('https://ve.dolarapi.com/v1/dolares',{oficial:'bcv',paralelo:'usdt'});
  await dolarapi('https://ve.dolarapi.com/v1/euros',{oficial:'euro'});
  if(!out.bcv)await pydolar('https://pydolarve.org/api/v1/dollar?page=bcv','bcv');
  if(!out.euro)await pydolar('https://pydolarve.org/api/v1/euro?page=bcv','euro');
  return {out:out,log:log};
}
async function autoRates(manual){
  if(autoRates.busy)return false;
  var r=curRates(),has=S.rates.length>0;
  if(!manual&&has&&r.date>=today())return true;
  autoRates.busy=true;if(UI.tab==='rates')render();
  var res;try{res=await fetchRates()}catch(e){res={out:{},log:['Error: '+e]}}
  autoRates.busy=false;UI.auto.log=res.log;var o=res.out,keys=Object.keys(o),full=o.bcv&&o.euro&&o.usdt;
  var sane=!has||(near(o.bcv,r.bcv)&&near(o.euro,r.euro)&&near(o.usdt,r.usdt));
  if(full&&sane){
    put('rates',{id:uid(),date:today(),bcv:o.bcv,euro:o.euro,usdt:o.usdt,auto:true,createdAt:Date.now()});
    UI.auto.ok=true;UI.auto.msg='Actualizadas automáticamente hoy a las '+new Date().toLocaleTimeString('es-VE',{hour:'2-digit',minute:'2-digit'})+'.';
    toast('Tasas de hoy actualizadas');render();return true;
  }
  UI.auto.ok=false;
  UI.auto.msg=keys.length&&!full?'Solo pude obtener: '+keys.join(', ')+'. Completa el resto a mano.':full?'Los valores recibidos se ven muy distintos a los de ayer. Revísalos a mano.':'No pude consultar las tasas por internet. Escríbelas a mano.';
  if(!sheetOpen()&&$('#lockscr').hidden&&(manual||!skipped()))rateSheet(full&&!sane?{}:o);
  if(UI.tab==='rates')render();
  return false;
}
function autoCard(){
  var a=UI.auto;
  return '<section class="card stack"><div class="row sb"><h3>Actualización automática</h3><span class="pill '+(a.ok?'good':'')+'">'+(autoRates.busy?'Consultando...':a.ok?'Activa':'Pendiente')+'</span></div>'
    +'<p class="muted" style="margin:0;font-size:14px">'+esc(a.msg)+' Al abrir la app el primer día, consulta el dólar BCV, el euro y el USDT. Si no puede, te pide las tasas.</p>'
    +'<div class="row wrapr"><button class="btn small primary" data-act="autorates">Actualizar ahora</button></div>'
    +(a.log.length?'<details><summary class="foot" style="cursor:pointer">Detalle técnico</summary><pre class="mono foot" style="white-space:pre-wrap;margin:8px 0 0">'+esc(a.log.join('\n'))+'</pre></details>':'')+'</section>';
}

/* PIN local (4 dígitos) */
async function sha(x){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('xc-istore|'+x));return Array.from(new Uint8Array(b)).map(function(v){return v.toString(16).padStart(2,'0')}).join('')}
var pinBuf='',pinFails=0,pinBlock=0,hiddenAt=0;
function drawDots(){document.querySelectorAll('#dots i').forEach(function(d,i){d.classList.toggle('on',i<pinBuf.length)})}
function showLock(){$('#lockscr').hidden=false;pinBuf='';drawDots();$('#lock-msg').textContent='Ingresa tu PIN'}
function unlock(){$('#lockscr').hidden=true;pinBuf='';pinFails=0;autoRates(false)}
async function pinKey(v){
  if(Date.now()<pinBlock){$('#lock-msg').textContent='Espera unos segundos para volver a intentar.';return}
  if(v==='del')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=v;
  drawDots();
  if(pinBuf.length<4)return;
  var ok=false;try{ok=(await sha(pinBuf))===S.settings.pinHash}catch(e){ok=false}
  if(ok){unlock();return}
  pinFails++;pinBuf='';drawDots();
  if(pinFails>=5){pinBlock=Date.now()+30000;pinFails=0;$('#lock-msg').textContent='Demasiados intentos. Espera 30 segundos.'}else $('#lock-msg').textContent='PIN incorrecto. Intenta de nuevo.';
}
function securityCard(){
  var on=!!S.settings.pinHash;
  return '<section class="card stack"><div class="row sb"><h3>Seguridad</h3><span class="pill '+(on?'good':'')+'">'+(on?'PIN activo':'Sin PIN')+'</span></div>'
    +'<p class="muted" style="margin:0;font-size:14px">Un PIN de 4 dígitos bloquea la app al abrirla y cuando vuelves a ella después de 30 segundos. Evita que otra persona vea tus cifras en tu teléfono.</p>'
    +'<div class="row wrapr"><button class="btn small" data-act="pinsheet">'+(on?'Cambiar o quitar PIN':'Crear PIN')+'</button></div></section>';
}
function pinSheet(){
  var on=!!S.settings.pinHash;F={kind:'pin'};
  openSheet(on?'Cambiar o quitar PIN':'Crear PIN','<div class="stack">'
    +(on?'<div class="field"><label for="pin-old">PIN actual</label><input type="password" id="pin-old" inputmode="numeric" maxlength="4" autocomplete="off"></div>':'')
    +'<div class="field"><label for="pin-new">PIN nuevo (4 números)</label><input type="password" id="pin-new" inputmode="numeric" maxlength="4" autocomplete="off"></div>'
    +'<div class="field"><label for="pin-new2">Repite el PIN nuevo</label><input type="password" id="pin-new2" inputmode="numeric" maxlength="4" autocomplete="off"></div>'
    +'<div class="err" id="pin-err"></div><button class="btn primary block" data-act="savepin">Guardar PIN</button>'
    +(on?'<button class="btn danger block" data-act="rmpin">Quitar PIN</button>':'')+'</div>');
}
async function savePin(){
  var on=!!S.settings.pinHash,err=$('#pin-err'),n1=$('#pin-new').value,n2=$('#pin-new2').value;
  if(on&&(await sha($('#pin-old').value))!==S.settings.pinHash){err.textContent='El PIN actual no coincide.';return}
  if(!/^\d{4}$/.test(n1)){err.textContent='El PIN nuevo debe tener 4 números.';return}
  if(n1!==n2){err.textContent='Los dos PIN nuevos no coinciden.';return}
  S.settings.pinHash=await sha(n1);saveSettings();closeSheet();toast('PIN guardado');render();
}
async function rmPin(t){
  var err=$('#pin-err');
  if((await sha($('#pin-old').value))!==S.settings.pinHash){err.textContent='Escribe tu PIN actual para quitarlo.';return}
  if(!armed(t))return;delete S.settings.pinHash;saveSettings();closeSheet();toast('PIN quitado');render();
}

/* ---------- acciones ---------- */
function armed(t,label){if(t.dataset.armed){return true}t.dataset.armed='1';var old=t.textContent;t.textContent=label||'Toca otra vez para confirmar';setTimeout(function(){delete t.dataset.armed;t.textContent=old},4000);return false}
function copyText(text,msg){
  var ok=function(){toast(msg||'Respaldo copiado')};
  var fallback=function(){var ta=$('#bk-text');
    if(!ta){openSheet('Copia este texto','<div class="stack"><textarea id="bk-text" style="min-height:220px"></textarea></div>');ta=$('#bk-text')}
    ta.value=text;ta.focus();ta.select();toast('Selecciona y copia el texto')};
  try{navigator.clipboard.writeText(text).then(ok,fallback)}catch(e){fallback()}
}
function snapshot(){var o={app:'xcstore',v:3,exportedAt:new Date().toISOString(),settings:S.settings};STORES.forEach(function(n){o[n]=S[n]});return JSON.stringify(o)}
function saveRatesFrom(a,b,c,errId){
  var bv=num($(a).value),e=num($(b).value),u=num($(c).value),err=$(errId);
  if(bv<=0||e<=0||u<=0){err.textContent='Escribe las tres tasas en bolívares.';return false}
  put('rates',{id:uid(),date:today(),bcv:bv,euro:e,usdt:u,createdAt:Date.now()});return true;
}

  rmphoto:function(){F.img='';F.imgSet=true;var p=F.id?prod(F.id):null,hold=p?{id:p.id,name:p.name,img:''}:{name:$('#p-name').value||'?',img:''};$('#p-pic').innerHTML=pic(hold)},

  savecap:function(){S.settings.capitalTarget=num($('#cap-t').value);saveSettings();toast('Objetivo guardado');render()},
  income:function(){incomeSheet()},incomeedit:function(t){incomeSheet(t.dataset.id)},saveincome:saveIncome,

  budgetedit:function(t){budgetSheet(t.dataset.id)},savebudget:saveBudget,
  delbudget:function(t){if(S.expenses.some(function(x){return x.itemId===t.dataset.id})){$('#g-err').textContent='Este rubro tiene gastos registrados. Edita su monto en lugar de eliminarlo.';return}
    if(!armed(t))return;del('budget',t.dataset.id);closeSheet();toast('Rubro eliminado');render()},
  expense:function(t){expenseSheet(null,t.dataset.item)},expenseedit:function(t){expenseSheet(t.dataset.id)},saveexpense:saveExpense,
  delexpense:function(t){if(!armed(t))return;del('expenses',t.dataset.id);closeSheet();toast('Gasto eliminado');render()},
  rep:function(t){UI.rep=t.dataset.v;render()},
  conv:function(){convSheet()},
  cvkey:function(t){cvKey(t.dataset.v)},
  cvclose:cvClose,
  cvrates:function(){cvClose();UI.tab='rates';render();window.scrollTo(0,0)},

  step:function(t){var i=$('#a-new');i.value=Math.max(0,Math.floor(num(i.value))+(+t.dataset.d));updateAdj()},

  sugcat:function(t){UI.sc=t.dataset.v;render()},
  sugall:function(){UI.sugAll=!UI.sugAll;render()},
  plm:function(t){UI.plm=shiftMonth(UI.plm||today().slice(0,7),+t.dataset.d);render()},
  copypl:function(){copyText(plText(),'Resumen copiado')},
  hist:function(t){UI.h[t.dataset.k]=t.dataset.v;render()},
  ratesheet:function(){autoRates(true)},autorates:function(){autoRates(true)},
  pinkey:function(t){pinKey(t.dataset.v)},pinsheet:pinSheet,savepin:function(){savePin()},rmpin:function(t){rmPin(t)},
  saverates:function(){if(saveRatesFrom('#r-bcv','#r-eur','#r-usdt','#r-err')){toast('Tasas guardadas');render()}},
  saverates2:function(){if(saveRatesFrom('#rr-bcv','#rr-eur','#rr-usdt','#rr-err')){closeSheet();toast('Tasas de hoy guardadas');render()}},
  keeprates:function(){try{localStorage.setItem('xc-rate-skip',today())}catch(e){UI.skip=today()}closeSheet();toast('Seguimos con las tasas anteriores')},
  backup:function(){var tx=snapshot();S.settings.lastBackup=today();saveSettings();copyText(tx,'Respaldo copiado')},
  restore:function(t){
    var err=$('#bk-err'),txt=$('#bk-text').value.trim();err.textContent='';
    if(!txt){err.textContent='Pega primero el texto del respaldo.';return}
    var d;try{d=JSON.parse(txt)}catch(e){err.textContent='El texto no es un respaldo válido.';return}
    if(!d||d.app!=='xcstore'||!['products','purchases','sales','rates'].every(function(n){return Array.isArray(d[n])})){err.textContent='Ese archivo no es un respaldo de XC iStore.';return}
    if(!armed(t,'Toca otra vez: reemplaza tus datos'))return;
    dbClear();STORES.forEach(function(n){S[n]=[];(d[n]||[]).forEach(function(o){put(n,o)})});S.settings=normSettings(d.settings);saveSettings();toast('Respaldo restaurado');render()},
  wipe:function(t){if(!armed(t,'Toca otra vez: borra todo'))return;dbClear();STORES.forEach(function(n){S[n]=[]});toast('Datos borrados');render()}
};

document.addEventListener('click',function(e){
  if(e.target.id==='scrim'){closeSheet();return}
  var t=e.target.closest('[data-act]');if(!t)return;var f=A[t.dataset.act];if(f)f(t,e);
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){UI.q=t.value;renderSalesList();return}
  if(t.id==='hq'){UI.h.q=t.value;renderHist();return}
  if(t.id==='s-prod'&&F.kind==='sale'){defaultPrice()}
  if(t.id==='pr-prod'&&F.kind==='price'){priceDefaults();return}
  if(t.hasAttribute('data-live')){if(F.kind==='sale')updateSale();else if(F.kind==='buy')updateBuy();else if(F.kind==='adj')updateAdj();else if(F.kind==='price')updatePrice();else if(F.kind==='split')updateSplit();else if(F.kind==='conv')updateConv()}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='bk-file'){var f=t.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){$('#bk-text').value=String(rd.result);toast('Archivo cargado. Toca Restaurar respaldo.')};rd.readAsText(f)}
  if(t.id==='p-file'){var g=t.files[0];if(!g)return;resizeImage(g,function(url){F.img=url;F.imgSet=true;$('#p-pic').innerHTML='<div class="pic"><img src="'+url+'" alt="Foto del producto"></div>'})}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(!$('#scrim').hidden)closeSheet();else cvClose()}});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='hidden'){hiddenAt=Date.now();return}
  if(S.settings.pinHash&&hiddenAt&&Date.now()-hiddenAt>30000&&$('#lockscr').hidden){showLock();return}
  if($('#lockscr').hidden){autoRates(false);if(UI.tab==='home')render()}
});
